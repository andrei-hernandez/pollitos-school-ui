<div class="page-wrapper">
  <div>
    @switch (headerType) {
      @case ('zetcollege') {
        <app-school-header schoolName="Zet College"/>
      }
      @case ('gerardoinstitute') {
        <app-school-header schoolName="Gerardo Institute"/>
      }
      @default {
        <app-default-header/>
      }
    }
  </div>

  <main class="main-content">
    <router-outlet/>
  </main>

  <footer>
    <app-footer/>
  </footer>
</div>
