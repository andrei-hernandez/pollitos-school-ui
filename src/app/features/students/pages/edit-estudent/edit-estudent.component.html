
<h2 mat-dialog-title>Edit Student</h2>
<mat-dialog-content>
    <p>Do you want to edit the selected student?</p>
    <app-student [student]="student"/>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>No</button>
  <button mat-button (click)="saveStudent()">save</button>
</mat-dialog-actions>
