<div class="container mx-auto my-5">
  <h2 class="text-2xl font-bold mb-4">List of Students</h2>

  @if (errorMessage) {
    <div class="text-red-500 mb-4">
      {{ errorMessage }}
    </div>
  }
  <table class="table-auto w-full border border-gray-300">
    <thead>
    <tr class="bg-gray-200">
      <th class="border px-4 py-2">ID</th>
      <th class="border px-4 py-2">First Name</th>
      <th class="border px-4 py-2">Last Name</th>
      <th class="border px-4 py-2">Age</th>
      <th class="border px-4 py-2">Actions</th>
    </tr>
    </thead>
    <tbody>
      @for (student of students; track student.id) {
        <tr>
          <td class="border px-4 py-2 text-center">{{ student.id }}</td>
          <td class="border px-4 py-2">{{ student.firstName }}</td>
          <td class="border px-4 py-2">{{ student.lastName }}</td>
          <td class="border px-4 py-2 text-center">{{ student.age }}</td>
          <td class="border px-4 py-2 text-center">
            <button
              class="bg-blue-500 text-white px-3 py-1 rounded mr-2"
              (click)="editStudent(student.id)"
            >
              Edit
            </button>
            <button
              class="bg-red-500 text-white px-3 py-1 rounded"
              (click)="deleteStudent(student.id)"
            >
              Delete
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
