<div class="container mx-auto p-4">
  <div class="max-w-md mx-auto bg-white rounded-lg shadow-md overflow-hidden md:max-w-lg">
    <div class="md:flex">
      <div class="w-full p-4">
        <div class="text-left mb-4">
          <h2 class="text-2xl font-bold">Update Grade</h2>
        </div>
        <!-- Formulario reactivo -->
        <form [formGroup]="gradeEditForm">
          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="courseId">Course Id</label>
            <input
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
              id="courseId"
              type="number"
              formControlName="courseId"
            />
          </div>
          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="score">Score</label>
            <input
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
              id="score"
              type="number"
              formControlName="score"
            />
          </div>
          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="studentId">Student Id</label>
            <input
              class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
              id="studentId"
              type="number"
              formControlName="studentId"
            />
          </div>
          <div class="flex items-center justify-end space-x-4">
            <button
              (click)="close()"
              class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
              type="button"
            >
              Cancel
            </button>
            <button
              (click)="updateGrade()"
              class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
              type="button"
            >
              Save
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
