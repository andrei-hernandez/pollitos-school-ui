<h2 mat-dialog-title>Edit Course</h2>
<mat-dialog-content>
    <p>Do you want to edit the selected course?</p>
    <app-course [course]="course"/>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>No</button>
  <button mat-button (click)="saveCourse()">save</button>
</mat-dialog-actions>
