<div class="container">
    <mat-form-field>
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input>
    </mat-form-field>
      
      <table mat-table [dataSource]="courses()" class="mat-elevation-z8">
      
        <!-- Position Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> Id. </th>
          <td mat-cell *matCellDef="let courses"> {{courses.id}} </td>
        </ng-container>
      
        <!-- Name Column -->
        <ng-container matColumnDef="nameCourse">
          <th mat-header-cell *matHeaderCellDef> nameCourse </th>
          <td mat-cell *matCellDef="let courses"> {{courses.nameCourse}} </td>
        </ng-container>
      
        <!-- Weight Column -->
        <ng-container matColumnDef="professorName">
          <th mat-header-cell *matHeaderCellDef> professorName </th>
          <td mat-cell *matCellDef="let courses"> {{courses.professorName}} </td>
        </ng-container>

        <!--option Column-->
        <ng-container matColumnDef="option">
          <th mat-header-cell *matHeaderCellDef> option </th>
          <td mat-cell *matCellDef="let courses">
            <div class="example-flex-container">
              <div class="example-button-container">
                <button mat-fab aria-label="edit course">
                  <mat-icon mat-raised-button (click)="openDialog('0ms','0ms', courses)">edit</mat-icon>
                </button>
              </div>
            </div>
          </td>
        </ng-container>
      
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      
        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>    
</div>
